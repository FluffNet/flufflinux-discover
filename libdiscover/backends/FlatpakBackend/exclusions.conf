# Flatpak applications hidden by Fluff Linux Discover.
#
# Add one appstream:// application ID per line. Matching is case-insensitive.
# End an ID with * to exclude that ID and all IDs beginning with it.
#
# Append -p("package-name") to hide an application only when that native
# pacman package is installed. This lets the Flatpak remain available on
# deployments that do not ship the native package.

appstream://org.winehq.Wine*
appstream://com.fightcade.Fightcade.wine
appstream://org.kde.dolphin.desktop
appstream://org.kde.konsole.desktop
appstream://org.videolan.VLC
appstream://org.mozilla.Thunderbird
appstream://org.kde.kate.desktop
appstream://org.kde.kwrite.desktop
appstream://io.missioncenter.MissionCenter
appstream://org.mozilla.firefox -p("firefox")
appstream://org.kde.ark.desktop
appstream://org.kde.gwenview.desktop
