# Flatpak applications hidden by Fluff Linux Discover.
#
# Add one Flatpak application ID per line. Matching is case-insensitive.
# End an ID with * to exclude that ID and all IDs beginning with it.
#
# Append -p("package-name") to hide an application only when that native
# pacman package is installed. This lets the Flatpak remain available on
# deployments that do not ship the native package.

org.winehq.Wine*
com.fightcade.Fightcade.wine
org.kde.dolphin.desktop
org.kde.konsole.desktop
org.videolan.VLC
org.mozilla.Thunderbird
org.kde.kate.desktop
org.kde.kwrite.desktop
io.missioncenter.MissionCenter
org.mozilla.firefox -p("firefox")
org.kde.ark.desktop
org.kde.gwenview.desktop
